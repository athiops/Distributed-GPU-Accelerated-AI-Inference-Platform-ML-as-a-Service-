global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "ml-platform"
    env: "production"

scrape_configs:
  # ── Platform Services ──────────────────────────────────────────────────────
  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:8000"]
    metrics_path: /metrics

  - job_name: "model-service"
    static_configs:
      - targets: ["model-service:8001"]
    metrics_path: /metrics

  - job_name: "inference-service"
    static_configs:
      - targets: ["inference-service:8002"]
    metrics_path: /metrics

  # ── Redis ──────────────────────────────────────────────────────────────────
  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # ── Prometheus self-scrape ─────────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
