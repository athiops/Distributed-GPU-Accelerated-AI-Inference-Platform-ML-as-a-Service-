---
# ════════════════════════════════════════════════════════════════════════════════
#  INGRESS – Route external traffic to API Gateway and Frontend
#  Requires: nginx ingress controller (kubectl apply -f https://... ingress-nginx)
# ════════════════════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ml-platform-ingress
  namespace: ml-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"         # Allow large model uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"          # Remove for local
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ml-platform.example.com
        - api.ml-platform.example.com
      secretName: ml-platform-tls
  rules:
    - host: ml-platform.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: api.ml-platform.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80

---
# ════════════════════════════════════════════════════════════════════════════════
#  ConfigMap – Shared environment variables
# ════════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-platform-config
  namespace: ml-platform
data:
  REDIS_URL: "redis://redis:6379"
  MODEL_SERVICE_URL: "http://model-service:8001"
  INFERENCE_SERVICE_URL: "http://inference-service:8002"
  BATCH_SIZE: "8"
  RATE_LIMIT_PER_MINUTE: "120"

---
# ════════════════════════════════════════════════════════════════════════════════
#  ServiceAccount + RBAC (minimal permissions)
# ════════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-platform-sa
  namespace: ml-platform

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ml-platform-role
  namespace: ml-platform
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ml-platform-rolebinding
  namespace: ml-platform
subjects:
  - kind: ServiceAccount
    name: ml-platform-sa
    namespace: ml-platform
roleRef:
  kind: Role
  name: ml-platform-role
  apiGroup: rbac.authorization.k8s.io
